<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麻雀点数計算アプリ Ver2.05</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            margin: 0;
            padding: 10px;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 1.2rem;
            text-align: center;
            margin-bottom: 15px;
            color: #2c3e50;
        }
        .card {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .card-title {
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: #495057;
        }
        label {
            display: inline-block;
            margin-right: 10px;
            margin-bottom: 5px;
            font-size: 0.85rem;
            cursor: pointer;
        }
        label.disabled {
            color: #adb5bd !important;
            cursor: not-allowed;
        }
        select, input[type="number"] {
            width: 100%;
            padding: 8px;
            font-size: 0.9rem;
            border: 1px solid #ced4da;
            border-radius: 4px;
            box-sizing: border-box;
            margin-top: 4px;
            background: #fff;
        }
        /* 丸ポチ縦揃え用グリッド */
        .radio-vertical-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .radio-line {
            display: grid;
            grid-template-columns: 80px 80px;
            align-items: center;
        }
        .radio-line label {
            display: inline-flex;
            align-items: center;
            margin: 0;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .radio-line input[type="radio"] {
            margin: 0 6px 0 0;
            cursor: pointer;
        }

        /* 本場選択用グリッド */
        .honba-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            margin-top: 4px;
        }
        .honba-grid label {
            background: #fff;
            border: 1px solid #ced4da;
            padding: 6px 2px;
            text-align: center;
            border-radius: 4px;
            font-size: 0.75rem;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
        }
        .honba-grid input[type="radio"] {
            margin: 0;
        }

        /* 頭（雀頭）の選択肢スタイル */
        .head-options {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-top: 4px;
        }

        /* 面子のボタン選択・符表示スタイル */
        .mianzi-row {
            background: #fff;
            border: 1px solid #e9ecef;
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 6px;
        }
        .mianzi-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 0.85rem;
        }
        .mianzi-options {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 4px;
        }
        .mianzi-options label {
            background: #f1f3f5;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            margin: 0;
            border: 1px solid #dee2e6;
        }
        .mianzi-options input[type="radio"] {
            margin-right: 2px;
        }
        .fu-label {
            font-size: 0.75rem;
            color: #0284c7;
            font-weight: bold;
        }

        .yaku-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            border: 1px solid #e9ecef;
            padding: 6px 10px;
            border-radius: 6px;
            margin-bottom: 5px;
        }
        .yaku-row label {
            margin: 0;
            flex: 1;
        }
        .help-btn {
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 0.75rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .checkbox-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }
        .auto-yaku-box {
            background: #eef2f7;
            border: 1px dashed #cbd5e1;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 0.85rem;
            color: #334155;
        }
        .auto-yaku-tag {
            display: inline-block;
            background: #dbeafe;
            color: #1e40af;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-right: 5px;
            margin-top: 3px;
        }
        .auto-yakuman-tag {
            display: inline-block;
            background: #fee2e2;
            color: #b91c1c;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-right: 5px;
            margin-top: 3px;
        }
        .hidden {
            display: none;
        }
        .result-box {
            background: #d4edda;
            border: 2px solid #28a745;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-top: 15px;
        }
        .result-score {
            font-size: 1.2rem;
            font-weight: bold;
            color: #155724;
            margin-top: 5px;
        }
        /* モーダル */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            max-width: 320px;
            width: 90%;
            text-align: center;
        }
        .modal-close {
            margin-top: 15px;
            padding: 6px 15px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        hr {
            border: 0;
            border-top: 1px solid #dee2e6;
            margin: 10px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>麻雀点数計算アプリ <span style="font-size:0.8rem; color:#666;">Ver2.05</span></h1>

    <!-- 1. 状況・アガリ方 ＆ 本場 -->
    <div class="card">
        <div class="card-title">1. 状況・アガリ方</div>
        <div class="radio-vertical-group" style="margin-bottom: 10px;">
            <div class="radio-line">
                <label><input type="radio" name="playerType" value="child" checked onchange="calculate()"> 子</label>
                <label><input type="radio" name="playerType" value="parent" onchange="calculate()"> 親</label>
            </div>
            <div class="radio-line">
                <label><input type="radio" name="winType" value="ron" checked onchange="calculate()"> ロン</label>
                <label><input type="radio" name="winType" value="tsumo" onchange="calculate()"> ツモ</label>
            </div>
        </div>
        
        <div style="font-size: 0.8rem; font-weight: bold; color: #495057; margin-bottom: 4px;">本場数</div>
        <div class="honba-grid">
            <label><input type="radio" name="honba" value="0" checked onchange="calculate()">0本場</label>
            <label><input type="radio" name="honba" value="1" onchange="calculate()">1本場</label>
            <label><input type="radio" name="honba" value="2" onchange="calculate()">2本場</label>
            <label><input type="radio" name="honba" value="3" onchange="calculate()">3本場</label>
            <label><input type="radio" name="honba" value="4" onchange="calculate()">4本場</label>
            <label><input type="radio" name="honba" value="5" onchange="calculate()">5本場</label>
            <label><input type="radio" name="honba" value="6" onchange="calculate()">6本場</label>
            <label><input type="radio" name="honba" value="7" onchange="calculate()">7本場</label>
        </div>
    </div>

    <!-- 0. 大元の分岐 -->
    <div class="card" style="background: #e2e8f0;">
        <div class="card-title">アガりの種類</div>
        <label><input type="radio" name="mainType" value="general" checked> 一般役（4面子1雀頭）</label>
        <label><input type="radio" name="mainType" value="chitoitsu"> 七対子</label>
        <label><input type="radio" name="mainType" value="yakuman"> 役満（複数選択可）</label>
    </div>

    <!-- ========================================== -->
    <!-- 【① 一般役エリア】 -->
    <!-- ========================================== -->
    <div id="generalArea">
        <div class="card">
            <div class="card-title">2. 待ちの形（頭の待ち）</div>
            <select id="waitType" onchange="calculate()">
                <option value="2">1面待ち (単騎 / カンチャン / ペンチャン) (+2符)</option>
                <option value="0">多面待ち (両面 / シャボ) (0符)</option>
            </select>
        </div>

        <!-- 3. 頭（雀頭）のWチェック防止化 -->
        <div class="card">
            <div class="card-title">3. 頭（雀頭）</div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                <span style="font-size:0.8rem; color:#666;">種類を選択</span>
                <span id="headFuDisplay" class="fu-label">0符</span>
            </div>
            <div class="head-options">
                <label><input type="radio" name="headType" value="none" checked onchange="calculate()"> なし(数牌2〜8等)</label>
                <label><input type="radio" name="headType" value="yakpai" onchange="calculate()"> 役牌 (+2符)</label>
                <label><input type="radio" name="headType" value="yaochu" onchange="calculate()"> 19字牌</label>
            </div>
        </div>

        <div class="card">
            <div class="card-title">4. 面子（①〜④）の設定</div>
            
            <!-- 面子① -->
            <div class="mianzi-row" data-index="0">
                <div class="mianzi-header">
                    <span>① 面子</span>
                    <span class="fu-label mianzi-fu-display">0符</span>
                </div>
                <div class="mianzi-options">
                    <label><input type="radio" name="m0" value="shuntsu" checked onchange="onMianziRadioChange(this)"> 順子</label>
                    <label><input type="radio" name="m0" value="meishuntsu" onchange="onMianziRadioChange(this)"> 明順(チー)</label>
                    <label><input type="radio" name="m0" value="ankotsu" onchange="onMianziRadioChange(this)"> 暗刻</label>
                    <label><input type="radio" name="m0" value="minkotsu" onchange="onMianziRadioChange(this)"> 明刻(ポン)</label>
                    <label><input type="radio" name="m0" value="ankan" onchange="onMianziRadioChange(this)"> 暗槓</label>
                    <label><input type="radio" name="m0" value="minkan" onchange="onMianziRadioChange(this)"> 明槓(カン)</label>
                </div>
                <div>
                    <label class="mianzi-yaochu-label disabled"><input type="checkbox" class="mianzi-yaochu" disabled onchange="calculate()"> 19字牌</label>
                </div>
            </div>

            <!-- 面子② -->
            <div class="mianzi-row" data-index="1">
                <div class="mianzi-header">
                    <span>② 面子</span>
                    <span class="fu-label mianzi-fu-display">0符</span>
                </div>
                <div class="mianzi-options">
                    <label><input type="radio" name="m1" value="shuntsu" checked onchange="onMianziRadioChange(this)"> 順子</label>
                    <label><input type="radio" name="m1" value="meishuntsu" onchange="onMianziRadioChange(this)"> 明順(チー)</label>
                    <label><input type="radio" name="m1" value="ankotsu" onchange="onMianziRadioChange(this)"> 暗刻</label>
                    <label><input type="radio" name="m1" value="minkotsu" onchange="onMianziRadioChange(this)"> 明刻(ポン)</label>
                    <label><input type="radio" name="m1" value="ankan" onchange="onMianziRadioChange(this)"> 暗槓</label>
                    <label><input type="radio" name="m1" value="minkan" onchange="onMianziRadioChange(this)"> 明槓(カン)</label>
                </div>
                <div>
                    <label class="mianzi-yaochu-label disabled"><input type="checkbox" class="mianzi-yaochu" disabled onchange="calculate()"> 19字牌</label>
                </div>
            </div>

            <!-- 面子③ -->
            <div class="mianzi-row" data-index="2">
                <div class="mianzi-header">
                    <span>③ 面子</span>
                    <span class="fu-label mianzi-fu-display">0符</span>
                </div>
                <div class="mianzi-options">
                    <label><input type="radio" name="m2" value="shuntsu" checked onchange="onMianziRadioChange(this)"> 順子</label>
                    <label><input type="radio" name="m2" value="meishuntsu" onchange="onMianziRadioChange(this)"> 明順(チー)</label>
                    <label><input type="radio" name="m2" value="ankotsu" onchange="onMianziRadioChange(this)"> 暗刻</label>
                    <label><input type="radio" name="m2" value="minkotsu" onchange="onMianziRadioChange(this)"> 明刻(ポン)</label>
                    <label><input type="radio" name="m2" value="ankan" onchange="onMianziRadioChange(this)"> 暗槓</label>
                    <label><input type="radio" name="m2" value="minkan" onchange="onMianziRadioChange(this)"> 明槓(カン)</label>
                </div>
                <div>
                    <label class="mianzi-yaochu-label disabled"><input type="checkbox" class="mianzi-yaochu" disabled onchange="calculate()"> 19字牌</label>
                </div>
            </div>

            <!-- 面子④ -->
            <div class="mianzi-row" data-index="3">
                <div class="mianzi-header">
                    <span>④ 面子</span>
                    <span class="fu-label mianzi-fu-display">0符</span>
                </div>
                <div class="mianzi-options">
                    <label><input type="radio" name="m3" value="shuntsu" checked onchange="onMianziRadioChange(this)"> 順子</label>
                    <label><input type="radio" name="m3" value="meishuntsu" onchange="onMianziRadioChange(this)"> 明順(チー)</label>
                    <label><input type="radio" name="m3" value="ankotsu" onchange="onMianziRadioChange(this)"> 暗刻</label>
                    <label><input type="radio" name="m3" value="minkotsu" onchange="onMianziRadioChange(this)"> 明刻(ポン)</label>
                    <label><input type="radio" name="m3" value="ankan" onchange="onMianziRadioChange(this)"> 暗槓</label>
                    <label><input type="radio" name="m3" value="minkan" onchange="onMianziRadioChange(this)"> 明槓(カン)</label>
                </div>
                <div>
                    <label class="mianzi-yaochu-label disabled"><input type="checkbox" class="mianzi-yaochu" disabled onchange="calculate()"> 19字牌</label>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">5. 追加の役・加点要素</div>
            
            <div class="auto-yaku-box">
                <div style="font-weight: bold; margin-bottom: 2px;">自動でついている役：</div>
                <div id="autoYakuList"><span style="color: #64748b; font-size: 0.8rem;">なし</span></div>
            </div>

            <div class="checkbox-grid">
                <label id="lbl-riichi"><input type="checkbox" name="yaku" value="riichi" onchange="calculate()"> 立直 (1)</label>
                <label id="lbl-ippatsu"><input type="checkbox" name="yaku" value="ippatsu" onchange="calculate()"> 一発 (1)</label>
                
                <label id="lbl-tanyao"><input type="checkbox" name="yaku" value="tanyao" onchange="calculate()"> タンヤオ (1)</label>
                <label id="lbl-ikkantsu"><input type="checkbox" name="yaku" value="ikkantsu" onchange="calculate()"> 一気通貫 (2/1)</label>

                <label id="lbl-honitsu"><input type="checkbox" name="yaku" value="honitsu" onchange="calculate()"> 混一色 <span style="font-size:0.75rem; color:#666;">(3/2)</span></label>
                <label id="lbl-chinitsu"><input type="checkbox" name="yaku" value="chinitsu" onchange="calculate()"> 清一色 <span style="font-size:0.75rem; color:#666;">(6/5)</span></label>

                <label id="lbl-sanshoku-dojun"><input type="checkbox" name="yaku" value="sanshokuDojun" onchange="calculate()"> 三色同順 (2/1)</label>
                <label id="lbl-sanshoku-dokoku"><input type="checkbox" name="yaku" value="sanshokuDokoku" onchange="calculate()"> 三色同刻 (2/1)</label>

                <label id="lbl-ipeko"><input type="checkbox" name="yaku" value="ipeko" onchange="calculate()"> 一盃口 (1)</label>
                <label id="lbl-ryanpeko"><input type="checkbox" name="yaku" value="ryanpeko" onchange="calculate()"> 二盃口 (3)</label>

                <label id="lbl-chanta"><input type="checkbox" name="yaku" value="chanta" onchange="calculate()"> 混全帯幺九 <span style="font-size:0.75rem; color:#666;">(2/1)</span></label>
                <label id="lbl-junchan"><input type="checkbox" name="yaku" value="junchan" onchange="calculate()"> 純全帯幺九 <span style="font-size:0.75rem; color:#666;">(3/2)</span></label>

                <label id="lbl-shousangen"><input type="checkbox" name="yaku" value="shousangen" onchange="calculate()"> 小三元 (4)</label>
                <span style="display:none;"></span>
            </div>
            
            <hr>
            <div class="card-title" style="font-size: 0.8rem; color: #666;">特殊なアガリ方（？解説付き）</div>
            
            <div class="yaku-row">
                <label id="lbl-rinshan"><input type="checkbox" name="yaku" value="rinshan" onchange="calculate()"> 嶺上開花 (1)</label>
                <button class="help-btn" onclick="showHelp('rinshan')">?</button>
            </div>
            <div class="yaku-row">
                <label id="lbl-chankan"><input type="checkbox" name="yaku" value="chankan" onchange="calculate()"> 槍槓 (1)</label>
                <button class="help-btn" onclick="showHelp('chankan')">?</button>
            </div>
            <div class="yaku-row">
                <label id="lbl-haitei"><input type="checkbox" name="yaku" value="haitei" onchange="calculate()"> 海底摸月 (1)</label>
                <button class="help-btn" onclick="showHelp('haitei')">?</button>
            </div>
            <div class="yaku-row">
                <label id="lbl-houtei"><input type="checkbox" name="yaku" value="houtei" onchange="calculate()"> 河底撈魚 (1)</label>
                <button class="help-btn" onclick="showHelp('houtei')">?</button>
            </div>

            <hr>
            <div style="margin-top: 8px;">
                <label>役牌・ドラ・赤ドラの合計数：</label>
                <select id="totalBonus" onchange="calculate()">
                    <option value="0">0個 (なし)</option>
                    <option value="1">1個</option>
                    <option value="2">2個</option>
                    <option value="3">3個</option>
                    <option value="4">4個</option>
                    <option value="5">5個</option>
                    <option value="6">6個</option>
                    <option value="7">7個</option>
                    <option value="8">8個</option>
                    <option value="9">9個</option>
                    <option value="10">10個</option>
                    <option value="11">11個</option>
                    <option value="12">12個</option>
                    <option value="13">13個以上 (数え役満)</option>
                </select>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 【② 七対子エリア】 -->
    <!-- ========================================== -->
    <div id="chitoitsuArea" class="card hidden">
        <div class="card-title">七対子の設定（一律25符・2翻ベース）</div>
        <div class="checkbox-grid">
            <label><input type="checkbox" name="chitoiYaku" value="riichi" onchange="calculate()"> 立直 (1)</label>
            <label><input type="checkbox" name="chitoiYaku" value="ippatsu" onchange="calculate()"> 一発 (1)</label>
            <label><input type="checkbox" name="chitoiYaku" value="tanyao" onchange="calculate()"> タンヤオ (1)</label>
            <label><input type="checkbox" name="chitoiYaku" value="honitsu" onchange="calculate()"> 混一色 (3)</label>
            <label><input type="checkbox" name="chitoiYaku" value="chinitsu" onchange="calculate()"> 清一色 (6)</label>
            <label><input type="checkbox" name="chitoiYaku" value="rinshan" onchange="calculate()"> 嶺上開花 (1)</label>
            <label><input type="checkbox" name="chitoiYaku" value="haitei" onchange="calculate()"> 海底摸月 (1)</label>
        </div>
        <hr>
        <div style="margin-top: 8px;">
            <label>ドラ・赤ドラの合計数：</label>
            <select id="chitoiBonus" onchange="calculate()">
                <option value="0">0個 (なし)</option>
                <option value="1">1個</option>
                <option value="2">2個</option>
                <option value="3">3個</option>
                <option value="4">4個</option>
                <option value="5">5個</option>
                <option value="6">6個</option>
                <option value="7">7個</option>
                <option value="8">8個</option>
                <option value="9">9個</option>
                <option value="10">10個</option>
                <option value="11">11個</option>
                <option value="12">12個</option>
                <option value="13">13個以上 (数え役満)</option>
            </select>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 【③ 役満エリア】 -->
    <!-- ========================================== -->
    <div id="yakumanArea" class="card hidden">
        <div class="card-title">役満の選択（複数選択でダブル・トリプル対応）</div>
        <div class="yaku-row"><label><input type="checkbox" name="yakuman" value="kokushi" onchange="calculate()"> 国士無双</label><button class="help-btn" onclick="showHelp('kokushi')">?</button></div>
        <div class="yaku-row"><label><input type="checkbox" name="yakuman" value="suankou" onchange="calculate()"> 四暗刻</label><button class="help-btn" onclick="showHelp('suankou')">?</button></div>
        <div class="yaku-row"><label><input type="checkbox" name="yakuman" value="daisangen" onchange="calculate()"> 大三元</label><button class="help-btn" onclick="showHelp('daisangen')">?</button></div>
        <div class="yaku-row"><label><input type="checkbox" name="yakuman" value="tsuisou" onchange="calculate()"> 字一色</label><button class="help-btn" onclick="showHelp('tsuisou')">?</button></div>
        <div class="yaku-row"><label><input type="checkbox" name="yakuman" value="ryuuiisou" onchange="calculate()"> 緑一色</label><button class="help-btn" onclick="showHelp('ryuuiisou')">?</button></div>
        <div class="yaku-row"><label><input type="checkbox" name="yakuman" value="chinroutou" onchange="calculate()"> 清老頭</label><button class="help-btn" onclick="showHelp('chinroutou')">?</button></div>
        <div class="yaku-row"><label><input type="checkbox" name="yakuman" value="shousuukii" onchange="calculate()"> 小四喜</label><button class="help-btn" onclick="showHelp('shousuukii')">?</button></div>
        <div class="yaku-row"><label><input type="checkbox" name="yakuman" value="daisuukii" onchange="calculate()"> 大四喜</label><button class="help-btn" onclick="showHelp('daisuukii')">?</button></div>
        <div class="yaku-row"><label><input type="checkbox" name="yakuman" value="suukantsu" onchange="calculate()"> 四槓子</label><button class="help-btn" onclick="showHelp('suukantsu')">?</button></div>
        <div class="yaku-row"><label><input type="checkbox" name="yakuman" value="chuurenpoutou" onchange="calculate()"> 九蓮宝灯</label><button class="help-btn" onclick="showHelp('chuurenpoutou')">?</button></div>
    </div>

    <!-- 結果表示エリア -->
    <div class="result-box">
        <div style="font-size: 0.85rem; font-weight: bold; color: #155724;">計算結果</div>
        <div class="result-score" id="resultText">-- 点</div>
    </div>

</div>

<!-- ?解説用モーダルウィンドウ -->
<div id="helpModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle" style="margin-top:0; color:#2c3e50;"></h3>
        <p id="modalText" style="font-size:0.9rem; color:#555; line-height:1.5;"></p>
        <button class="modal-close" onclick="closeHelp()">閉じる</button>
    </div>
</div>

<script>
    const helpData = {
        rinshan: { title: "嶺上開花 (リンシャンカイホウ)", text: "カンをしたときに、嶺上牌からツモってアガった場合に1翻つきます。（ツモ限定）" },
        chankan: { title: "槍槓 (チャンカン)", text: "他人が小明カンをしたその牌でロンアガリした場合に1翻つきます。（ロン限定）" },
        haitei: { title: "海底摸月 (ハイテイモウユエ)", text: "山に残っている最後の牌をツモってアガった場合に1翻つきます。（ツモ限定）" },
        houtei: { title: "河底撈魚 (ホウテイラオユイ)", text: "ゲーム最後の捨て牌に対してロンアガリした場合に1翻つきます。（ロン限定）" },
        kokushi: { title: "国士無双 (コクシムソウ)", text: "19字牌（幺九牌）の全種類を1枚ずつ集め、どれか1つを頭にして作る役満。\n\n【見本】🀐🀙🀡🀏🀀🀁🀂🀃🀆🀅🀄 ＋ (どれか1枚)" },
        suankou: { title: "四暗刻 (スーアンコウ)", text: "自分で引いた同じ牌のセット（暗刻・暗槓）を4つ揃えてアガる役満。\n\n【見本】🀇🀇🀇 🀃🀃🀃 🀐🀐🀐 🀙🀙🀙 ＋ 頭" },
        daisangen: { title: "大三元 (ダイサンゲン)", text: "「白・発・中」の3種類すべてを刻子（または槓子）にして揃える役満。\n\n【見本】🀆🀆🀆 🀅🀅🀅 🀄🀄🀄" },
        tsuisou: { title: "字一色 (ツーイーソー)", text: "手牌のすべてが字牌（東南西北白発中）だけで構成される役満。\n\n【見本】🀀🀀🀀 🀂🀂🀂 🀆🀆 🀄🀄 ＋ 🀁🀁" },
        ryuuiisou: { title: "緑一色 (リューイーソー)", text: "索子の2・3・4・6・8 と「発」の牌だけで構成される役満。\n\n【見本】🀒🀓🀔 🀖🀖 🀘🀘🀘 🀅🀅🀅" },
        chinroutou: { title: "清老頭 (チンロウートウ)", text: "手牌のすべてが1と9の老頭牌（ロンソウハイ）だけで構成される役満。\n\n【見本】🀇🀇🀇 🀏🀏🀏 🀐🀐🀐 🀙🀙 ＋ 🀙" },
        shousuukii: { title: "小四喜 (ショウスーシー)", text: "東南西北のうち3つを刻子、残りの1つを頭にして作る役満。\n\n【見本】🀀🀀🀀 🀁🀁🀁 🀂🀂🀂 🀃🀃" },
        daisuukii: { title: "大四喜 (ダイスーシー)", text: "東南西北の4種類すべてを刻子（または槓子）にして揃えるダブル級の役満。\n\n【見本】🀀🀀🀀 🀁🀁🀁 🀂🀂🀂 🀃🀃🀃" },
        suukantsu: { title: "四槓子 (スーカンツ)", text: "1つの手牌の中で「カン」を4回行う（4つのカン子を作る）非常に珍しい役満。\n\n【見本】カン×4回" },
        chuurenpoutou: { title: "九蓮宝灯 (チューレンポウトウ)", text: "門前で同色の牌を「1112345678999 + 同色どれか1枚」の形にして揃える役満。\n\n【見本】🀇🀇🀇🀈🀉🀊🀋🀌🀍🀎🀏🀏🀏 ＋ 🀋" }
    };

    function showHelp(key) {
        const data = helpData[key];
        if (!data) return;
        document.getElementById('modalTitle').innerText = data.title;
        document.getElementById('modalText').innerHTML = data.text.replace(/\n/g, '<br>');
        document.getElementById('helpModal').style.display = 'flex';
    }

    function closeHelp() {
        document.getElementById('helpModal').style.display = 'none';
    }

    const mainTypeRadios = document.querySelectorAll('input[name="mainType"]');
    const generalArea = document.getElementById('generalArea');
    const chitoitsuArea = document.getElementById('chitoitsuArea');
    const yakumanArea = document.getElementById('yakumanArea');

    mainTypeRadios.forEach(radio => {
        radio.addEventListener('change', (e) => {
            const val = e.target.value;
            generalArea.classList.add('hidden');
            chitoitsuArea.classList.add('hidden');
            yakumanArea.classList.add('hidden');

            if (val === 'general') generalArea.classList.remove('hidden');
            if (val === 'chitoitsu') chitoitsuArea.classList.remove('hidden');
            if (val === 'yakuman') yakumanArea.classList.remove('hidden');

            calculate();
        });
    });

    function onMianziRadioChange(radio) {
        const row = radio.closest('.mianzi-row');
        const yaochuCb = row.querySelector('.mianzi-yaochu');
        const yaochuLabel = row.querySelector('.mianzi-yaochu-label');
        const val = radio.value;

        if (val === 'shuntsu' || val === 'meishuntsu') {
            yaochuCb.disabled = true;
            yaochuCb.checked = false;
            yaochuLabel.classList.add('disabled');
        } else {
            yaochuCb.disabled = false;
            yaochuLabel.classList.remove('disabled');
        }
        calculate();
    }

    function handleHonChinExclusivity(changedId) {
        const honitsuCb = document.querySelector('input[name="yaku"][value="honitsu"]');
        const chinitsuCb = document.querySelector('input[name="yaku"][value="chinitsu"]');
        
        if (changedId === 'honitsu' && honitsuCb.checked) {
            if (chinitsuCb) chinitsuCb.checked = false;
        } else if (changedId === 'chinitsu' && chinitsuCb.checked) {
            if (honitsuCb) honitsuCb.checked = false;
        }

        const chitoiHon = document.querySelector('#chitoitsuArea input[value="honitsu"]');
        const chitoiChin = document.querySelector('#chitoitsuArea input[value="chinitsu"]');
        if (changedId === 'chitoi-honitsu' && chitoiHon.checked) {
            if (chitoiChin) chitoiChin.checked = false;
        } else if (changedId === 'chitoi-chinitsu' && chitoiChin.checked) {
            if (chitoiHon) chitoiHon.checked = false;
        }
    }

    function handleChantaGroupExclusivity(changedId) {
        const chantaCb = document.querySelector('input[name="yaku"][value="chanta"]');
        const junchanCb = document.querySelector('input[name="yaku"][value="junchan"]');

        if (changedId === 'chanta' && chantaCb.checked) {
            if (junchanCb) junchanCb.checked = false;
        } else if (changedId === 'junchan' && junchanCb.checked) {
            if (chantaCb) chantaCb.checked = false;
        }
    }

    function handlePekoExclusivity(changedId) {
        const ipekoCb = document.querySelector('input[name="yaku"][value="ipeko"]');
        const ryanpekoCb = document.querySelector('input[name="yaku"][value="ryanpeko"]');

        if (changedId === 'ipeko' && ipekoCb.checked) {
            if (ryanpekoCb) ryanpekoCb.checked = false;
        } else if (changedId === 'ryanpeko' && ryanpekoCb.checked) {
            if (ipekoCb) ipekoCb.checked = false;
        }
    }

    function setYaoDisabled(labelId, isDisabled) {
        const lbl = document.getElementById(labelId);
        if (!lbl) return;
        const cb = lbl.querySelector('input');
        if (isDisabled) {
            lbl.classList.add('disabled');
            cb.disabled = true;
            cb.checked = false; 
        } else {
            lbl.classList.remove('disabled');
            cb.disabled = false;
        }
    }

    function calculate() {
        const mainType = document.querySelector('input[name="mainType"]:checked').value;
        const winType = document.querySelector('input[name="winType"]:checked').value;
        const isParent = document.querySelector('input[name="playerType"]:checked').value === 'parent';
        const honba = parseInt(document.querySelector('input[name="honba"]:checked').value) || 0;

        // --- ③ 役満モード ---
        if (mainType === 'yakuman') {
            document.getElementById('autoYakuList').innerHTML = '<span style="color: #64748b; font-size: 0.8rem;">なし</span>';
            const selectedYakuman = document.querySelectorAll('input[name="yakuman"]:checked');
            const yakumanCount = selectedYakuman.length;

            if (yakumanCount === 0) {
                document.getElementById('resultText').innerText = "役満を選択してください";
                return;
            }

            let baseRon = 32000 * yakumanCount;
            let scoreText = "";

            if (isParent) {
                baseRon = 48000 * yakumanCount;
                if (winType === 'ron') {
                    scoreText = `${baseRon + (honba * 300)}点 (${honba}本場・親・役満)`;
                } else {
                    let all = 16000 * yakumanCount + (honba * 100);
                    scoreText = `${all}点オール (${honba}本場・親・ツモ)`;
                }
            } else {
                if (winType === 'ron') {
                    scoreText = `${baseRon + (honba * 300)}点 (${honba}本場・子・役満)`;
                } else {
                    let p1 = 8000 * yakumanCount + (honba * 100);
                    let p2 = 16000 * yakumanCount + (honba * 100);
                    scoreText = `${p1} / ${p2}点 (${honba}本場・子・役満)`;
                }
            }
            document.getElementById('resultText').innerText = scoreText;
            return;
        }

        // --- ② 七対子モード ---
        if (mainType === 'chitoitsu') {
            document.getElementById('autoYakuList').innerHTML = '<span style="color: #64748b; font-size: 0.8rem;">なし</span>';
            let totalHan = 2; 
            
            document.querySelectorAll('input[name="chitoiYaku"]:checked').forEach(cb => {
                if (cb.value === 'honitsu') totalHan += 3;
                else if (cb.value === 'chinitsu') totalHan += 6;
                else totalHan += 1;
            });

            let bonus = parseInt(document.getElementById('chitoiBonus').value) || 0;
            totalHan += bonus;

            let roundedFu = 25;
            let basicPoints = roundedFu * Math.pow(2, 2 + totalHan);

            let isMangan = false;
            let manganType = "";
            if (totalHan >= 11) { manganType = "三倍満"; isMangan = true; }
            else if (totalHan >= 8) { manganType = "倍満"; isMangan = true; }
            else if (totalHan >= 6) { manganType = "跳満"; isMangan = true; }
            else if (totalHan >= 5 || basicPoints >= 2000) { manganType = "満貫"; isMangan = true; }

            let scoreText = "";
            if (totalHan >= 13) {
                if (isParent) {
                    scoreText = winType === 'ron' ? `${48000 + (honba * 300)}点 (数え・親・ロン)` : `${16000 + (honba * 100)}点オール (数え・親・ツモ)`;
                } else {
                    scoreText = winType === 'ron' ? `${32000 + (honba * 300)}点 (数え・子・ロン)` : `${8000 + (honba * 100)} / ${16000 + (honba * 100)}点 (数え・子・ツモ)`;
                }
            } else if (isMangan) {
                let base = 2000;
                if (manganType === "跳満") base = 3000;
                if (manganType === "倍満") base = 4000;
                if (manganType === "三倍満") base = 6000;

                if (isParent) {
                    scoreText = winType === 'ron' ? `${base * 6 + (honba * 300)}点 (${manganType}・親)` : `${base * 2 + (honba * 100)}点オール (${manganType}・親)`;
                } else {
                    scoreText = winType === 'ron' ? `${base * 4 + (honba * 300)}点 (${manganType}・子)` : `${base + (honba * 100)} / ${base * 2 + (honba * 100)}点 (${manganType}・子)`;
                }
            } else {
                let points = basicPoints * 4;
                if (isParent) points = basicPoints * 6;
                points = Math.ceil(points / 100) * 100;

                if (winType === 'ron') {
                    scoreText = `${points + (honba * 300)}点`;
                } else {
                    let p1 = Math.ceil((basicPoints) / 100) * 100 + (honba * 100);
                    let p2 = Math.ceil((basicPoints * 2) / 100) * 100 + (honba * 100);
                    scoreText = isParent ? `${p2}点オール` : `${p1} / ${p2}点`;
                }
            }
            document.getElementById('resultText').innerText = scoreText + ` (25符 ${totalHan}翻)`;
            return;
        }

        // --- ① 一般役モード ---
        let hasNaki = false;
        let shuntsuCount = 0;
        let hasKotsu = false; 
        let darkKotsuCount = 0; 
        let kantsuCount = 0;    
        let hasMinkan = false;
        let ankotsuOrAnkanCount = 0;

        const headType = document.querySelector('input[name="headType"]:checked').value;
        const headFu = (headType === 'yakpai') ? 2 : 0;
        document.getElementById('headFuDisplay').innerText = `${headFu}符`;

        const isHeadYaochu = (headType === 'yakpai' || headType === 'yaochu');
        let allMianziYaochu = true;
        let mianziTypes = [];

        document.querySelectorAll('.mianzi-row').forEach((row) => {
            const checkedRadio = row.querySelector('input[type="radio"]:checked');
            const val = checkedRadio ? checkedRadio.value : 'shuntsu';
            mianziTypes.push(val);

            const yaochuCb = row.querySelector('.mianzi-yaochu');
            const fuDisplay = row.querySelector('.mianzi-fu-display');

            if (val === 'shuntsu' || val === 'meishuntsu') shuntsuCount++;
            if (val === 'ankotsu' || val === 'minkotsu' || val === 'ankan' || val === 'minkan') hasKotsu = true;
            if (val === 'ankotsu' || val === 'ankan') darkKotsuCount++;
            if (val === 'ankan' || val === 'minkan') kantsuCount++;
            
            if (val === 'minkan') hasMinkan = true;
            if (val === 'ankotsu' || val === 'ankan') ankotsuOrAnkanCount++;
            if (val === 'meishuntsu' || val === 'minkotsu' || val === 'minkan') hasNaki = true;

            let mFu = 0;
            const isY = yaochuCb.checked;
            if (!yaochuCb.disabled && isY) {
                if (val === 'ankotsu') mFu = 8;
                else if (val === 'minkotsu') mFu = 4;
                else if (val === 'ankan') mFu = 32;
                else if (val === 'minkan') mFu = 16;
            } else {
                if (val === 'ankotsu') mFu = 4;
                else if (val === 'minkotsu') mFu = 2;
                else if (val === 'ankan') mFu = 16;
                else if (val === 'minkan') mFu = 8;
            }
            fuDisplay.innerText = `${mFu}符`;

            if (!yaochuCb.checked) {
                allMianziYaochu = false;
            }
        });

        const waitTypeFu = parseInt(document.getElementById('waitType').value);

        // --- 自動役満判定（四暗刻・四槓子） ---
        const isSuankouAuto = (shuntsuCount === 0 && !hasMinkan && ankotsuOrAnkanCount === 4);
        const isSuukantsuAuto = (kantsuCount === 4);

        if (isSuankouAuto || isSuukantsuAuto) {
            let autoYakumanName = isSuankouAuto ? "四暗刻" : "四槓子";
            document.getElementById('autoYakuList').innerHTML = `<span class="auto-yakuman-tag">${autoYakumanName} (役満)</span>`;
            
            let baseRon = 32000;
            let scoreText = "";
            if (isParent) {
                baseRon = 48000;
                if (winType === 'ron') {
                    scoreText = `${baseRon + (honba * 300)}点 (${honba}本場・親・${autoYakumanName})`;
                } else {
                    scoreText = `${16000 + (honba * 100)}点オール (${honba}本場・親・${autoYakumanName}ツモ)`;
                }
            } else {
                if (winType === 'ron') {
                    scoreText = `${baseRon + (honba * 300)}点 (${honba}本場・子・${autoYakumanName})`;
                } else {
                    scoreText = `${8000 + (honba * 100)} / ${16000 + (honba * 100)}点 (${honba}本場・子・${autoYakumanName}ツモ)`;
                }
            }
            document.getElementById('resultText').innerText = scoreText;
            return;
        }

        // --- 自動判定役 ---
        const canPinfu = (shuntsuCount === 4 && !hasKotsu && waitTypeFu === 0 && headType !== 'yakpai' && !hasNaki);
        const canMenzento = (!hasNaki && winType === 'tsumo');
        const isToitoi = (shuntsuCount === 0);
        const isSanankou = (darkKotsuCount >= 3);
        const isSankantsu = (kantsuCount >= 3);
        const hasShuntsu = (shuntsuCount > 0);
        const isHonroutouAuto = (isHeadYaochu && allMianziYaochu && !hasShuntsu);

        let autoYakuHtml = "";
        if (canPinfu) autoYakuHtml += '<span class="auto-yaku-tag">平和 (1)</span>';
        if (canMenzento) autoYakuHtml += '<span class="auto-yaku-tag">門前清自モ和 (1)</span>';
        if (isToitoi) autoYakuHtml += '<span class="auto-yaku-tag">対々和 (2)</span>';
        if (isSanankou) autoYakuHtml += '<span class="auto-yaku-tag">三暗刻 (2)</span>';
        if (isSankantsu) autoYakuHtml += '<span class="auto-yaku-tag">三槓子 (2)</span>';
        if (isHonroutouAuto) autoYakuHtml += '<span class="auto-yaku-tag text-red-highlight">混老頭 (2)</span>';
        document.getElementById('autoYakuList').innerHTML = autoYakuHtml === "" ? '<span style="color: #64748b; font-size: 0.8rem;">なし</span>' : autoYakuHtml;

        // --- 排他・グレーアウト制御 ---
        setYaoDisabled('lbl-riichi', hasNaki);
        setYaoDisabled('lbl-ippatsu', hasNaki || !document.querySelector('input[value="riichi"]').checked);

        let hasAnyYaochu = (headType === 'yaochu');
        document.querySelectorAll('.mianzi-yaochu').forEach(cb => { if(cb.checked) hasAnyYaochu = true; });
        const isChantaGroupActive = document.querySelector('input[value="chanta"]').checked || document.querySelector('input[value="junchan"]').checked;
        setYaoDisabled('lbl-tanyao', hasAnyYaochu || isChantaGroupActive);

        setYaoDisabled('lbl-pinfu', !canPinfu);

        const canSanshokuIkkantsu = (shuntsuCount >= 3);
        setYaoDisabled('lbl-sanshoku-dojun', !canSanshokuIkkantsu);
        setYaoDisabled('lbl-ikkantsu', !canSanshokuIkkantsu);

        let kotsuTotal = 0;
        mianziTypes.forEach(v => {
            if(['ankotsu', 'minkotsu', 'ankan', 'minkan'].includes(v)) kotsuTotal++;
        });
        setYaoDisabled('lbl-sanshoku-dokoku', kotsuTotal < 3);

        const canIpeko = (!hasNaki && shuntsuCount >= 2);
        const canRyanpeko = (!hasNaki && shuntsuCount === 4);
        setYaoDisabled('lbl-ipeko', !canIpeko);
        setYaoDisabled('lbl-ryanpeko', !canRyanpeko);

        const allMianziYaochuChecked = (function() {
            let res = true;
            document.querySelectorAll('.mianzi-yaochu').forEach(cb => { if(!cb.checked) res = false; });
            return res;
        })();
        const canChantaJunchan = (headType !== 'none' && allMianziYaochuChecked);
        setYaoDisabled('lbl-chanta', canChantaJunchan);
        setYaoDisabled('lbl-junchan', canChantaJunchan);

        // 小三元は頭が役牌のときのみ選択可能
        setYaoDisabled('lbl-shousangen', headType !== 'yakpai');

        // 混老頭自動成立時はチャンタ・ジュンチャンをグレーアウト
        if (isHonroutouAuto) {
            setYaoDisabled('lbl-chanta', true);
            setYaoDisabled('lbl-junchan', true);
        }

        setYaoDisabled('lbl-rinshan', winType === 'ron');
        setYaoDisabled('lbl-chankan', winType === 'tsumo');
        setYaoDisabled('lbl-haitei', winType === 'ron');
        setYaoDisabled('lbl-houtei', winType === 'tsumo');

        // --- 符計算 ---
        let fu = 20 + waitTypeFu + headFu;
        document.querySelectorAll('.mianzi-row').forEach(row => {
            const checkedRadio = row.querySelector('input[type="radio"]:checked');
            const val = checkedRadio ? checkedRadio.value : 'shuntsu';
            const yaochuCb = row.querySelector('.mianzi-yaochu');
            const isY = yaochuCb.checked;

            if (!yaochuCb.disabled && isY) {
                if (val === 'ankotsu') fu += 8;
                if (val === 'minkotsu') fu += 4;
                if (val === 'ankan') fu += 32;
                if (val === 'minkan') fu += 16;
            } else {
                if (val === 'ankotsu') fu += 4;
                if (val === 'minkotsu') fu += 2;
                if (val === 'ankan') fu += 16;
                if (val === 'minkan') fu += 8;
            }
        });

        if (winType === 'ron') fu += 10;
        else fu += 2;

        let roundedFu = Math.ceil(fu / 10) * 10;
        if (roundedFu < 30) roundedFu = 30;

        // --- 翻数計算 ---
        const yakuElements = document.querySelectorAll('input[name="yaku"]:checked');
        let totalHan = 0;
        
        if (canPinfu) totalHan += 1;
        if (canMenzento) totalHan += 1;
        if (isToitoi) totalHan += 2;
        if (isSanankou) totalHan += 2;
        if (isSankantsu) totalHan += 2;
        if (isHonroutouAuto) totalHan += 2;

        yakuElements.forEach(cb => {
            const id = cb.value;
            const label = cb.closest('label');
            if (label && label.classList.contains('disabled')) return;

            if (id === 'riichi') totalHan += 1;
            if (id === 'ippatsu') totalHan += 1;
            if (id === 'pinfu' && !canPinfu) totalHan += 1;
            if (id === 'tanyao') totalHan += 1; 
            if (id === 'honitsu') totalHan += hasNaki ? 2 : 3;
            if (id === 'chinitsu') totalHan += hasNaki ? 5 : 6;
            if (id === 'sanshokuDojun') totalHan += hasNaki ? 1 : 2;
            if (id === 'ikkantsu') totalHan += hasNaki ? 1 : 2;
            if (id === 'sanshokuDokoku') totalHan += hasNaki ? 1 : 2; // 三色同刻の食い下がり対応（門前2 / 鳴き1）
            if (id === 'ipeko') totalHan += 1;
            if (id === 'ryanpeko') totalHan += 3;
            if (id === 'chanta') totalHan += hasNaki ? 1 : 2;
            if (id === 'junchan') totalHan += hasNaki ? 2 : 3;
            if (id === 'shousangen') totalHan += 4; // 小三元は実質4翻
            if (['rinshan', 'chankan', 'haitei', 'houtei'].includes(id)) totalHan += 1;
        });

        let bonusCount = parseInt(document.getElementById('totalBonus').value) || 0;
        totalHan += bonusCount;

        if (totalHan === 0) {
            document.getElementById('resultText').innerText = "役の種類を選択してください";
            return;
        }

        // 数え役満判定
        if (totalHan >= 13) {
            if (isParent) {
                if (winType === 'ron') document.getElementById('resultText').innerText = `${48000 + (honba * 300)}点 (数え役満・親・ロン)`;
                else document.getElementById('resultText').innerText = `${16000 + (honba * 100)}点オール (数え役満・親・ツモ)`;
            } else {
                if (winType === 'ron') document.getElementById('resultText').innerText = `${32000 + (honba * 300)}点 (数え役満・子・ロン)`;
                else document.getElementById('resultText').innerText = `${8000 + (honba * 100)} / ${16000 + (honba * 100)}点 (数え役満・子・ツモ)`;
            }
            return;
        }

        let basicPoints = roundedFu * Math.pow(2, 2 + totalHan);
        let isMangan = false;
        let manganType = "";

        if (totalHan >= 11) { manganType = "三倍満"; isMangan = true; }
        else if (totalHan >= 8) { manganType = "倍満"; isMangan = true; }
        else if (totalHan >= 6) { manganType = "跳満"; isMangan = true; }
        else if (totalHan >= 5 || basicPoints >= 2000) { manganType = "満貫"; isMangan = true; }

        let scoreText = "";
        if (isMangan) {
            let base = 2000;
            if (manganType === "跳満") base = 3000;
            if (manganType === "倍満") base = 4000;
            if (manganType === "三倍満") base = 6000;

            if (isParent) {
                if (winType === 'ron') scoreText = `${base * 6 + (honba * 300)}点 (${manganType}・親)`;
                else scoreText = `${base * 2 + (honba * 100)}点オール (${manganType}・親)`;
            } else {
                if (winType === 'ron') scoreText = `${base * 4 + (honba * 300)}点 (${manganType}・子)`;
                else scoreText = `${base + (honba * 100)} / ${base * 2 + (honba * 100)}点 (${manganType}・子)`;
            }
            document.getElementById('resultText').innerText = scoreText + ` (${roundedFu}符 ${totalHan}翻)`;
        } else {
            let points = basicPoints * 4;
            if (isParent) points = basicPoints * 6;
            points = Math.ceil(points / 100) * 100;

            if (winType === 'ron') {
                scoreText = `${points + (honba * 300)}点`;
            } else {
                let p1 = Math.ceil((basicPoints) / 100) * 100 + (honba * 100);
                let p2 = Math.ceil((basicPoints * 2) / 100) * 100 + (honba * 100);
                if (isParent) scoreText = `${p2}点オール`;
                else scoreText = `${p1} / ${p2}点`;
            }
            document.getElementById('resultText').innerText = scoreText + ` (${roundedFu}符 ${totalHan}翻)`;
        }
    }

    document.querySelectorAll('input[name="yaku"]').forEach(cb => {
        cb.addEventListener('change', (e) => {
            const val = e.target.value;
            if (val === 'honitsu' || val === 'chinitsu') {
                handleHonChinExclusivity(val);
            }
            if (['chanta', 'junchan'].includes(val)) {
                handleChantaGroupExclusivity(val);
            }
            if (val === 'ipeko' || val === 'ryanpeko') {
                handlePekoExclusivity(val);
            }
            calculate();
        });
    });

    document.querySelectorAll('input[name="chitoiYaku"]').forEach(cb => {
        cb.addEventListener('change', (e) => {
            if (e.target.value === 'honitsu' || e.target.value === 'chinitsu') {
                handleHonChinExclusivity('chitoi-' + e.target.value);
            }
            calculate();
        });
    });

    document.querySelectorAll('input[name="headType"]').forEach(radio => {
        radio.addEventListener('change', calculate);
    });

    calculate();
</script>

</body>
</html>
